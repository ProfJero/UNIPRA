* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #F4F0E6; }
.card {
  width: 1200px; height: 630px;
  display: flex;
  position: relative;
  background: #F4F0E6;
  overflow: hidden;
}
.frame {
  position: absolute;
  inset: 16px;
  border: 1.5px solid #C4A35A;
  pointer-events: none;
  z-index: 5;
}
.crest-pane {
  width: 440px;
  height: 630px;
  flex: none;
  background: radial-gradient(ellipse at 50% 46%, #143656 0%, #0B2C4A 68%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.crest-pane img {
  width: 392px;
  height: auto;
  display: block;
  filter: drop-shadow(0 12px 18px rgba(0,0,0,0.35));
}
.gold {
  width: 7px;
  flex: none;
  background: #C4A35A;
}
.copy {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 52px 64px 52px 52px;
  background:
    radial-gradient(ellipse at 110% -10%, rgba(196,163,90,0.22), transparent 42%),
    #F4F0E6;
}
.kicker {
  font-family: "UPS Sans", sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #0B2C4A;
  margin: 0 0 18px;
}
h1 {
  font-family: "UPS Serif", serif;
  font-weight: 700;
  font-size: 62px;
  line-height: 0.94;
  letter-spacing: -0.02em;
  color: #0B2C4A;
  margin: 0;
}
h1 .sub {
  display: block;
  margin-top: 12px;
  font-family: "UPS Serif", serif;
  font-weight: 400;
  font-size: 34px;
  letter-spacing: 0.008em;
  line-height: 1.05;
  color: #1A2330;
}
.rule {
  width: 88px;
  height: 3px;
  background: #C4A35A;
  margin: 22px 0 16px;
}
.motto {
  font-family: "UPS Serif", serif;
  font-style: italic;
  font-weight: 400;
  font-size: 26px;
  line-height: 1.2;
  color: #0B2C4A;
  margin: 0;
}
.meta {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: "UPS Sans", sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #0B2C4A;
}
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #C4A35A; flex: none;
}
</style>
</head>

  <div class="card">
    <div class="frame"></div>
    <div class="crest-pane">

    </div>
    <div class="gold"></div>
    <div class="copy">
      <p class="kicker">Cape Coast, Ghana</p>
      <h1>University Practice<span class="sub">Senior High School</span></h1>
      <div class="rule"></div>
      <p class="motto">Service to the Community</p>
      <div class="meta">
        <span>UNIPRA</span><i class="dot"></i>
        <span>Est. 1976</span><i class="dot"></i>
        <span>FLOREAT</span>
      </div>
    </div>
  </div>
</body>
